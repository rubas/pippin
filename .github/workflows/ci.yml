name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 1.95 is the rust-version in Cargo.toml (egui's minimum).
        toolchain: [stable, "1.95"]
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev libavcodec-dev libavutil-dev libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      # The runner has no GPU, so the test decodes in software, as pippin does
      # on a machine without CUDA and VAAPI. The streams are HEVC 4:4:4, which
      # the Mac sends, and 4:2:0.
      - name: Decode sample streams in software
        run: |
          dir="$RUNNER_TEMP/hevc"
          mkdir "$dir"
          for spec in t444:yuv444p t420:yuv420p; do
            ffmpeg -v error -f lavfi -i testsrc2=size=1280x720:rate=30 -frames:v 30 \
              -c:v libx265 -x265-params log-level=error -pix_fmt "${spec#*:}" -f hevc "$dir/${spec%:*}.hevc"
          done
          PIPPIN_TEST_HEVC_DIR="$dir" cargo test --locked decodes_sample_streams -- --ignored --nocapture
      - run: cargo clippy --locked --all-targets
        if: matrix.toolchain == 'stable'

  e2e:
    name: e2e (types and tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
